# Synthetic real-SQL acceptance only. No source crawl or production credentials.
name: Disposable property sync acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: property-sync-disposable-acceptance
  cancel-in-progress: false
jobs:
  disposable:
    if: vars.PROPERTY_SYNC_DB_ACCEPTANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRA_TEST_DATABASE_URL: ${{ secrets.ASTRA_TEST_DATABASE_URL }}
      ASTRA_TEST_BRANCH_ID: ${{ vars.ASTRA_TEST_BRANCH_ID }}
      ASTRA_TEST_DATABASE_CONFIRMED: ${{ vars.ASTRA_TEST_DATABASE_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify disposable database before any fixture test
        run: |
          node --input-type=module -e '
          import { assertDisposableNeonTestTarget } from "./src/lib/neon/disposable-test-target.mjs";
          if (!process.env.ASTRA_TEST_DATABASE_URL) throw Error("DISPOSABLE_DATABASE_REQUIRED_NO_SKIPPED_PASS");
          await assertDisposableNeonTestTarget(process.env.ASTRA_TEST_DATABASE_URL);
          '
      - name: Sequential ingestion and source gates
        run: npm run test:property-sync:db
      - name: Sequential publication and next-ingestion readback
        run: npm run test:property-sync:publication:db
      - name: Authenticated metadata and controlled operation reservations
        run: npm run test:property-sync:admin:db
      - name: Reviewed withdrawal competing actors and public readback
        run: npm run test:property-sync:withdrawal:db
      - name: Safe acceptance summary
        if: always()
        run: |
          echo 'Disposable synthetic SQL tests only. Live provider acceptance and three scheduled production cycles are separate gates.' >> "$GITHUB_STEP_SUMMARY"
