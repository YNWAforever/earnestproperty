name: Daily owner-capture publication
"on":
  schedule:
    # 09:00 Asia/Hong_Kong. Actions cron is UTC. This schedule does not collect 28hse.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - shadow
          - apply
          - replay-shadow
          - replay-apply
          - publication-only
          - owner-publication
          - owner-publication-dry-run
        default: shadow
      scope:
        default: agent:540
        required: true
        type: string
      replay_asset:
        description: >-
          Exact private frozen request asset; replay/publication-only require matching verified
          handoff
        type: string
      operation_id:
        description: Server-reserved operation identity for authenticated dashboard dispatch
        type: string
      bootstrap:
        description: Only for approved first baseline with no existing DB receipt
        type: boolean
        default: false
concurrency:
  group: property-sync-agent-540
  cancel-in-progress: false
permissions:
  contents: read
env:
  GH_TOKEN: ${{ secrets.PROPERTY_SYNC_EVIDENCE_TOKEN || github.token }}
  GH_REPO: ${{ vars.PROPERTY_SYNC_EVIDENCE_REPO || github.repository }}
  MODE: ${{ inputs.mode || 'owner-publication' }}
  SCOPE: ${{ inputs.scope || 'agent:540' }}
  EXPECTED_BRANCH: ${{ vars.PROPERTY_SYNC_EXPECTED_BRANCH }}
  POLICY_APPROVED: ${{ vars.PROPERTY_SYNC_POLICY_APPROVED }}
  MANUAL_APPLY_ENABLED: ${{ vars.PROPERTY_SYNC_MANUAL_APPLY_ENABLED }}
  OWNER_DAILY_ENABLED: ${{ vars.OWNER_PUBLICATION_DAILY_ENABLED }}
  OWNER_MANUAL_ENABLED: ${{ vars.OWNER_PUBLICATION_MANUAL_APPLY_ENABLED }}
  OWNER_INPUT_SHA256: ${{ vars.OWNER_PUBLICATION_INPUT_SHA256 }}
  OWNER_CAPTURE_ASSET: ${{ vars.OWNER_PUBLICATION_CAPTURE_ASSET }}
  OWNER_CHOICES: ${{ vars.OWNER_PUBLICATION_CHOICES }}
  REPLAY_ASSET: ${{ inputs.replay_asset }}
  BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deterministic collector helpers
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -r scripts/property-sync/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked bridge dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate operator gates and private evidence destination
        shell: bash
        run: >-
          set -euo pipefail

          python scripts/property-sync/daily_artifacts.py validate --scope "$SCOPE" --ref
          "$GITHUB_REF" --branch "$EXPECTED_BRANCH"

          gh api "repos/$GH_REPO" > evidence-repository.json

          python scripts/property-sync/daily_artifacts.py private --request evidence-repository.json

          gh release view property-sync-evidence >/dev/null

          case "$MODE" in
           shadow|replay-shadow) ;;
           apply|replay-apply|publication-only)
            case "$GITHUB_EVENT_NAME" in
             schedule) exit 1 ;;
             workflow_dispatch) test "$MANUAL_APPLY_ENABLED" = true ;;
             *) exit 1 ;;
            esac
            test "$POLICY_APPROVED" = python-v2.2 ;;
           owner-publication|owner-publication-dry-run)
            case "$MODE" in
             owner-publication)
              case "$GITHUB_EVENT_NAME" in
               schedule) test "$OWNER_DAILY_ENABLED" = true ;;
               workflow_dispatch) test "$OWNER_MANUAL_ENABLED" = true ;;
               *) exit 1 ;;
              esac
              ;;
             owner-publication-dry-run) test "$GITHUB_EVENT_NAME" = workflow_dispatch ;;
            esac
            [[ "$OWNER_INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$OWNER_CAPTURE_ASSET" == "owner-capture-${OWNER_INPUT_SHA256}.tar.gz" ]]
            ;;
           *) exit 1 ;;
          esac
        id: evidence-gate
      - name: Reconcile private baseline against read-only current database receipt
        if: env.MODE != 'owner-publication' && env.MODE != 'owner-publication-dry-run'
        shell: bash
        run: >-
          set -euo pipefail

          node scripts/mls/verify-daily-target.mjs

          node scripts/mls/read-sync-authority.mjs --out current-authority.json

          python -c 'import json; a=json.load(open("current-authority.json")); assert
          a["parser_version"]=="python-v2.2"'

          gh release view property-sync-evidence --json assets > baseline-assets.json

          asset=$(python scripts/property-sync/daily_artifacts.py latest --request
          baseline-assets.json)

          if [ -n "$asset" ]; then
           mkdir -p baseline-download
           gh release download property-sync-evidence --pattern "$asset" --dir baseline-download
           python scripts/property-sync/daily_artifacts.py unpack --request "baseline-download/$asset" --destination baseline-download
           node scripts/mls/read-sync-authority.mjs --payload baseline-download/baseline/request.json --receipt baseline-download/baseline/receipt.json --out checked-authority.json
          else
           python -c 'import json,os; a=json.load(open("current-authority.json")); assert not a["receipt_id"], "Existing baseline needs evidence recovery"; assert os.environ["MODE"]=="shadow" or os.environ["BOOTSTRAP"]=="true", "Explicit bootstrap required"'
          fi

          echo "baseline=$asset" >> "$GITHUB_OUTPUT"
        id: baseline
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PROPERTY_SYNC_EXPECTED_DATABASE_HOST: ${{ vars.PROPERTY_SYNC_EXPECTED_DATABASE_HOST }}
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    if: github.event_name == 'workflow_dispatch' || vars.PROPERTY_SYNC_DAILY_ENABLED == 'true'
    outputs:
      baseline: ${{ steps.baseline.outputs.baseline }}
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
  collect:
    # Manual HTTP collection only. The 09:00 Asia/Hong_Kong schedule never enters this job
    # and does not use Firecrawl or PROPERTY_SYNC_28HSE_TRANSPORT.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deterministic collector helpers
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -r scripts/property-sync/requirements.txt
      - name: Restore verified accepted full baseline
        shell: bash
        run: |-
          set -euo pipefail
          if [ -n "$BASELINE_ASSET" ]; then
           mkdir -p baseline-download
           gh release download property-sync-evidence --pattern "$BASELINE_ASSET" --dir baseline-download
           python scripts/property-sync/daily_artifacts.py unpack --request "baseline-download/$BASELINE_ASSET" --destination baseline-download
           python scripts/property-sync/daily_artifacts.py restore --destination baseline-download/baseline --root daily-output
          fi
      - name: Collect without database access
        id: collection
        shell: bash
        run: >-
          set -euo pipefail

          collection_status=0

          python scripts/property-sync/run_28hse_sync.py --root daily-output --dry-run >
          collection-result.json || collection_status=$?

          python scripts/property-sync/daily_artifacts.py diagnostics --request collection-result.json
          --output "$GITHUB_OUTPUT"

          if [ "$collection_status" -ne 0 ]; then exit "$collection_status"; fi

          payload=$(python scripts/property-sync/daily_artifacts.py select --root daily-output)

          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"
        env:
          PROPERTY_SYNC_28HSE_TRANSPORT: ${{ vars.PROPERTY_SYNC_28HSE_TRANSPORT || 'http' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        if: ${{ !startsWith(env.MODE, 'replay-') && env.MODE != 'publication-only' }}
      - name: Freeze and pin immutable request and raw before database access
        shell: bash
        run: >-
          set -euo pipefail

          mkdir -p handoff

          cp "$PAYLOAD" "handoff/request-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

          python scripts/property-sync/daily_artifacts.py archive --root daily-output --destination
          daily-archives

          cp daily-archives/raw.tar.gz "handoff/raw-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"

          python scripts/property-sync/daily_artifacts.py freeze --request
          "handoff/request-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" --raw
          "handoff/raw-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz" --gate "$(dirname
          "$PAYLOAD")/gate.json" --destination
          "handoff/handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" --git-sha "$GITHUB_SHA"

          python scripts/property-sync/daily_artifacts.py verify --request
          "handoff/handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" --root handoff

          python scripts/property-sync/daily_artifacts.py pin --request
          "handoff/handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" --root handoff

          echo "HANDOFF_ASSET=handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
        if: ${{ !startsWith(env.MODE, 'replay-') && env.MODE != 'publication-only' }}
      - name: Download exact frozen replay evidence
        shell: bash
        run: >-
          set -euo pipefail

          [[ "$REPLAY_ASSET" =~ ^request-[0-9]+-[0-9]+\.json$ ]]

          asset="${REPLAY_ASSET/request-/handoff-}"

          python scripts/property-sync/daily_artifacts.py fetch --asset "$asset" --root handoff

          python scripts/property-sync/daily_artifacts.py verify --request "handoff/$asset" --root
          handoff

          echo "HANDOFF_ASSET=$asset" >> "$GITHUB_ENV"
        if: startsWith(env.MODE, 'replay-') || env.MODE == 'publication-only'
      - name: Export only protected evidence reference
        shell: bash
        run: |-
          set -euo pipefail
          echo "handoff=$HANDOFF_ASSET" >> "$GITHUB_OUTPUT"
        id: handoff
      - name: Preserve interrupted private checkpoints
        shell: bash
        run: >-
          set -euo pipefail

          mkdir -p daily-output

          python scripts/property-sync/daily_artifacts.py archive --root daily-output --destination
          failure-archives

          cp failure-archives/raw.tar.gz "unresolved-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"

          gh release upload property-sync-evidence
          "unresolved-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
        if: failure() || cancelled()
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always() && github.event.repository.private == true
        continue-on-error: true
        with:
          name: ${{ format('sync-checkpoints-{0}-{1}',github.run_id,github.run_attempt) }}
          path: failure-archives/raw.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    needs:
      - preflight
    if: needs.preflight.result == 'success' && github.event_name != 'schedule' && inputs.mode != 'owner-publication' && inputs.mode != 'owner-publication-dry-run'
    env:
      BASELINE_ASSET: ${{ needs.preflight.outputs.baseline }}
    outputs:
      error_code: ${{ steps.collection.outputs.error_code }}
      pages_read: ${{ steps.collection.outputs.pages_read }}
      pages_failed: ${{ steps.collection.outputs.pages_failed }}
      handoff: ${{ steps.handoff.outputs.handoff }}
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deterministic collector helpers
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -r scripts/property-sync/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked bridge dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Read verified frozen handoff
        shell: bash
        run: >-
          set -euo pipefail

          python scripts/property-sync/daily_artifacts.py fetch --asset "$HANDOFF_ASSET" --root
          handoff

          python scripts/property-sync/daily_artifacts.py verify --request "handoff/$HANDOFF_ASSET"
          --root handoff --scope "$SCOPE"

          payload=$(python -c 'import json,os;
          print("handoff/"+json.load(open("handoff/"+os.environ["HANDOFF_ASSET"]))["request"]["key"])')

          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"

          mkdir -p daily-output
      - name: Validate shadow request
        shell: bash
        run: >-
          set -euo pipefail

          python scripts/property-sync/replay_28hse_sync.py --payload "$PAYLOAD" --root daily-output
          > replay-result.json
        if: "!endsWith(env.MODE, 'apply')"
      - name: Apply frozen request with bounded immutable retries
        shell: bash
        run: >-
          set -euo pipefail

          node scripts/mls/verify-daily-target.mjs

          python scripts/property-sync/replay_28hse_sync.py --payload "$PAYLOAD" --root daily-output
          --apply > replay-result.json

          receipt=$(python -c 'import
          json;print(json.load(open("replay-result.json"))["receipt_path"])')

          node scripts/mls/read-sync-authority.mjs --payload "$PAYLOAD" --receipt "$receipt" --out
          current-authority.json

          python scripts/property-sync/daily_artifacts.py baseline --request "$PAYLOAD" --receipt
          "$receipt" --destination baseline

          asset=$(python scripts/property-sync/daily_artifacts.py name --request "$PAYLOAD" --run-id
          "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT")

          tar -czf "$asset" baseline

          gh release upload property-sync-evidence "$asset"
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PROPERTY_SYNC_EXPECTED_DATABASE_HOST: ${{ vars.PROPERTY_SYNC_EXPECTED_DATABASE_HOST }}
        if: endsWith(env.MODE, 'apply')
      - name: Pin ingestion results even after unknown outcomes
        shell: bash
        run: >-
          set -euo pipefail

          python scripts/property-sync/daily_artifacts.py archive --root daily-output --destination
          ingestion-archives

          cp ingestion-archives/compact.tar.gz "compact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"

          gh release upload property-sync-evidence
          "compact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
        if: always()
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    needs:
      - preflight
      - collect
    env:
      HANDOFF_ASSET: ${{ needs.collect.outputs.handoff }}
    if: needs.collect.result == 'success' && inputs.mode != 'publication-only' && github.event_name != 'schedule' && inputs.mode != 'owner-publication' && inputs.mode != 'owner-publication-dry-run'
    outputs:
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deterministic collector helpers
        shell: bash
        run: |-
          set -euo pipefail
          python -m pip install -r scripts/property-sync/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked bridge dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Read verified frozen handoff
        shell: bash
        run: >-
          set -euo pipefail

          python scripts/property-sync/daily_artifacts.py fetch --asset "$HANDOFF_ASSET" --root
          handoff

          python scripts/property-sync/daily_artifacts.py verify --request "handoff/$HANDOFF_ASSET"
          --root handoff --scope "$SCOPE"

          payload=$(python -c 'import json,os;
          print("handoff/"+json.load(open("handoff/"+os.environ["HANDOFF_ASSET"]))["request"]["key"])')

          echo "PAYLOAD=$payload" >> "$GITHUB_ENV"

          mkdir -p daily-output
      - name: Publish verified imported drafts
        shell: bash
        run: >-
          set -euo pipefail

          node scripts/mls/publish-daily-listings.mjs --payload "$PAYLOAD" --report
          daily-output/publication.json
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PROPERTY_SYNC_EXPECTED_DATABASE_HOST: ${{ vars.PROPERTY_SYNC_EXPECTED_DATABASE_HOST }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Pin private publication result
        shell: bash
        run: |-
          set -euo pipefail
          if [ -f daily-output/publication.json ]; then
           cp daily-output/publication.json "publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
           gh release upload property-sync-evidence "publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          fi
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && github.event.repository.private == true
        continue-on-error: true
        with:
          name: ${{ format('sync-publication-{0}-{1}',github.run_id,github.run_attempt) }}
          path: daily-output/publication.json
          retention-days: 90
          if-no-files-found: ignore
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    needs:
      - preflight
      - collect
      - ingest
    env:
      HANDOFF_ASSET: ${{ needs.collect.outputs.handoff }}
    if: >-
      always() && needs.preflight.result == 'success' && needs.collect.result == 'success' &&
      (needs.ingest.result == 'success' || inputs.mode == 'publication-only') && github.event_name
      != 'schedule' && (inputs.mode == 'apply' || inputs.mode == 'replay-apply' || inputs.mode ==
      'publication-only')
    outputs:
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
  owner-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    needs:
      - preflight
    if: needs.preflight.result == 'success' && (github.event_name == 'schedule' || inputs.mode == 'owner-publication' || inputs.mode == 'owner-publication-dry-run')
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked publication dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the approved owner-capture bundle
        shell: bash
        run: |-
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$MODE" != owner-publication ]; then
           echo OWNER_SCHEDULE_MODE_REQUIRED >&2
           exit 1
          fi
          mkdir -p owner-capture-download owner-capture
          gh release download property-sync-evidence --pattern "$OWNER_CAPTURE_ASSET" --dir owner-capture-download
          python - <<'PY'
          import os, sys, tarfile
          path = os.path.join("owner-capture-download", os.environ["OWNER_CAPTURE_ASSET"])
          with tarfile.open(path, "r:gz") as archive:
              for member in archive.getmembers():
                  name = member.name
                  if member.issym() or member.islnk() or name.startswith("/") or ".." in name.split("/"):
                      sys.exit("OWNER_CAPTURE_PATH_REJECTED")
              archive.extractall("owner-capture", filter="data")
          PY
          test -f owner-capture/import_ready.frozen.json
          test -d owner-capture/photos
          actual=$(sha256sum owner-capture/import_ready.frozen.json | awk '{print $1}')
          test "$actual" = "$OWNER_INPUT_SHA256"
          if [ -n "${OWNER_CHOICES:-}" ]; then
           [[ "$OWNER_CHOICES" =~ ^[A-Z][0-9]{6}=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(,[A-Z][0-9]{6}=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})*$ ]]
          fi
      - name: Publish owner capture into site listings
        if: env.MODE == 'owner-publication'
        shell: bash
        env:
          IMPORT_TARGET_ENV: ${{ vars.IMPORT_TARGET_ENV }}
          IMPORT_BLOB_TARGET_ENV: ${{ vars.IMPORT_BLOB_TARGET_ENV }}
          IMPORT_DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
          IMPORT_BLOB_READ_WRITE_TOKEN: ${{ secrets.IMPORT_BLOB_READ_WRITE_TOKEN }}
          IMPORT_BLOB_STORE_ID: ${{ vars.IMPORT_BLOB_STORE_ID }}
          IMPORT_BLOB_HOST: ${{ vars.IMPORT_BLOB_HOST }}
        run: |-
          set -euo pipefail
          mkdir -p owner-output
          choose_args=()
          if [ -n "${OWNER_CHOICES:-}" ]; then
           IFS=',' read -ra pairs <<< "$OWNER_CHOICES"
           for pair in "${pairs[@]}"; do choose_args+=(--choose "$pair"); done
          fi
          status=0
          node scripts/mls/owner-publication.mjs --apply --driver=neon-ws --input owner-capture/import_ready.frozen.json --confirm-production="$OWNER_INPUT_SHA256" --report owner-output/owner-publication "${choose_args[@]}" >/dev/null || status=$?
          if [ "$status" -eq 1 ]; then exit 1; fi
          if [ "$status" -gt 2 ]; then exit "$status"; fi
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report = JSON.parse(readFileSync(process.argv[1], "utf8")); if (report.mode !== "APPLY" || !report.result) throw new Error("OWNER_PUBLICATION_REPORT_INVALID"); const published = report.result.published?.length ?? 0; const current = report.result.alreadyPublished?.length ?? 0; const unknown = report.result.unknown?.length ?? 0; const held = report.result.held?.length ?? 0; if (unknown || published + current < 1) throw new Error("OWNER_PUBLICATION_WROTE_NOTHING"); console.log(JSON.stringify({ published, alreadyPublished: current, held }));' owner-output/owner-publication.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then echo "Owner policy held some rows. Eligible listings were created, updated, or already current. The private report lists the holds." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Read owner capture without writing
        if: env.MODE == 'owner-publication-dry-run'
        shell: bash
        env:
          IMPORT_TARGET_ENV: ${{ vars.IMPORT_TARGET_ENV }}
          IMPORT_BLOB_TARGET_ENV: ${{ vars.IMPORT_BLOB_TARGET_ENV }}
          IMPORT_DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
        run: |-
          set -euo pipefail
          mkdir -p owner-output
          choose_args=()
          if [ -n "${OWNER_CHOICES:-}" ]; then
           IFS=',' read -ra pairs <<< "$OWNER_CHOICES"
           for pair in "${pairs[@]}"; do choose_args+=(--choose "$pair"); done
          fi
          status=0
          node scripts/mls/owner-publication.mjs --driver=neon-ws --input owner-capture/import_ready.frozen.json --confirm-production="$OWNER_INPUT_SHA256" --report owner-output/owner-publication "${choose_args[@]}" >/dev/null || status=$?
          if [ "$status" -eq 1 ]; then exit 1; fi
          if [ "$status" -gt 2 ]; then exit "$status"; fi
          echo "Owner publication dry-run wrote no listings. Exit ${status}." >> "$GITHUB_STEP_SUMMARY"
      - name: Pin private owner-publication report
        if: always()
        shell: bash
        run: |-
          set -euo pipefail
          if [ -f owner-output/owner-publication.json ]; then
           cp owner-output/owner-publication.json "owner-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
           gh release upload property-sync-evidence "owner-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          fi
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    outputs:
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: execution-start
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked bridge dependencies
        shell: bash
        run: |-
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public result from private report
        id: public-verify
        shell: bash
        run: |-
          set -euo pipefail
          mkdir -p verification
          asset="publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if [ "$PUBLICATION_RESULT" = success ]; then
           gh release download property-sync-evidence --pattern "$asset" --dir verification
           node scripts/mls/verify-sync-publication.mjs --report "verification/$asset" --out verification/result.json
           echo "public_verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Safe job summary
        shell: bash
        run: >-
          set -euo pipefail

          echo "Source:28Hse Scope:agent:540 Collection:$COLLECTION_RESULT
          Ingestion:$INGESTION_RESULT Publication:$PUBLICATION_RESULT
          OwnerPublication:$OWNER_RESULT" >> "$GITHUB_STEP_SUMMARY"

          echo 'Scheduled 09:00 Asia/Hong_Kong runs use owner-capture publication only. They do not
          collect 28hse and do not use Firecrawl.' >> "$GITHUB_STEP_SUMMARY"

          echo 'Failed or unknown stages preserve existing inventory. Replay the verified frozen
          handoff; publication-only does not collect or ingest.' >> "$GITHUB_STEP_SUMMARY"

          echo 'Private evidence and current full database receipt are required for recovery.
          Scheduled stability requires three actual successful daily cycles.' >>
          "$GITHUB_STEP_SUMMARY"
        if: always()
      - id: execution-finish
        if: always()
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
    needs:
      - preflight
      - collect
      - ingest
      - publish
      - owner-publish
    env:
      COLLECTION_RESULT: ${{ needs.collect.result }}
      INGESTION_RESULT: ${{ needs.ingest.result }}
      PUBLICATION_RESULT: ${{ needs.publish.result }}
      OWNER_RESULT: ${{ needs.owner-publish.result }}
    outputs:
      public_verified: ${{ steps.public-verify.outputs.public_verified }}
      started_at: ${{ steps.execution-start.outputs.at }}
      finished_at: ${{ steps.execution-finish.outputs.at }}
    if: always() && needs.preflight.result == 'success'

  record:
    if: always() && vars.PROPERTY_SYNC_OBSERVABILITY_ENABLED == 'true' && github.event_name != 'schedule' && inputs.mode != 'owner-publication' && inputs.mode != 'owner-publication-dry-run'
    needs: [preflight, collect, ingest, publish, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r scripts/property-sync/requirements.txt
      - name: Read exact private handoff and publication report without collection
        env:
          HANDOFF_ASSET: ${{ needs.collect.outputs.handoff }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p execution-report
          if [[ "$HANDOFF_ASSET" =~ ^handoff-[0-9]+-[0-9]+\.json$ ]]; then
            python scripts/property-sync/daily_artifacts.py fetch --asset "$HANDOFF_ASSET" --root execution-report
            python scripts/property-sync/daily_artifacts.py verify --request "execution-report/$HANDOFF_ASSET" --root execution-report --scope "$SCOPE"
            asset=$(python -c 'import json,os; print(json.load(open("execution-report/"+os.environ["HANDOFF_ASSET"]))["request"]["key"])')
            echo "RECORD_MANIFEST=execution-report/$HANDOFF_ASSET" >> "$GITHUB_ENV"
            echo "RECORD_PAYLOAD=execution-report/$asset" >> "$GITHUB_ENV"
            echo "RECORD_REQUEST_ASSET=$asset" >> "$GITHUB_ENV"
          fi
          name="publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if gh release download property-sync-evidence --pattern "$name" --dir execution-report; then
            echo "RECORD_PUBLICATION=execution-report/$name" >> "$GITHUB_ENV"
          fi
      - name: Persist bounded execution metadata and reconcile actual receipts
        run: node scripts/mls/record-sync-execution.mjs
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PROPERTY_SYNC_EXPECTED_DATABASE_HOST: ${{ vars.PROPERTY_SYNC_EXPECTED_DATABASE_HOST }}
          PROPERTY_SYNC_EXPECTED_BRANCH: ${{ vars.PROPERTY_SYNC_EXPECTED_BRANCH }}
          RECORD_NEEDS: ${{ toJSON(needs) }}
          RECORD_OPERATION_ID: ${{ inputs.operation_id }}
