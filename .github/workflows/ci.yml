# CI gates run on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Pinned, not "latest" -- an unpinned bun broke this CI run when a new
      # release changed bun:test's mock.module semantics enough to make
      # workers/mls-container/src/container.test.ts's Container mock stop
      # taking effect (this.ctx came back undefined in 7 tests that passed
      # locally against 1.3.12). Bump deliberately, verified locally, not
      # automatically.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - run: npm run build

      # Full non-":db" test:* matrix from package.json. The three ":db"-suffixed
      # scripts (test:mls:db, test:control-plane:db, test:youtube-sync:db) need a
      # live database and are intentionally excluded here -- see the P0 baseline
      # report for what each script covers and its current pass/fail state.
      - run: npm run test:corridor
      - run: npm run test:seo

      # Added during P1 (design-system foundation): src/lib/format.ts,
      # src/components/layout/*, src/components/media/AppImage.tsx, and
      # src/styles.css didn't exist at P0 baseline.
      - run: npm run test:format
      - run: npm run test:layout
      - run: npm run test:media
      - run: npm run test:styles

      # Added during P2 (data trust): src/routes/district.sham-tseng.test.mjs
      # didn't exist at P1 baseline -- it guards DR-5 (no unsourced school
      # list on the 深井 district page).
      - run: npm run test:district

      - run: npm run test:blog
      - run: npm run test:videos
      - run: npm run test:homepage
      - run: npm run test:mls
      - run: npm run test:property-sync
      - run: npm run test:property-sync:daily
      - run: npm run test:property-sync:admin
      - run: npm run test:property-sync:withdrawal
      - run: npm run test:property-sync:release
      - name: Install Chromium for isolated source-sync UI
        run: npx playwright install --with-deps chromium
      - run: npm run test:property-sync:ui
      - run: npm run test:property-maintenance:ui
      - run: npm run test:operations:ui
      - run: npm run test:staff-setup:ui
      - run: npm run test:whatsapp-mobile:ui
      - run: npm run test:property-sync:recovery:ui
      - run: npm run test:admin-daily-work:ui
      - run: npm run test:admin-campaign-review:ui
      - run: npm run test:admin-performance:ui
      - run: npm run test:admin-link-bulk:ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv scripts/property-sync/.venv
      - run: scripts/property-sync/.venv/bin/python -m pip install -r scripts/property-sync/requirements.txt
      - run: npm run test:property-sync:python
      - run: npm run test:listing-search
      - run: npm run test:public-number-search:db
      - run: npm run test:listing-priority
      - run: npm run test:estate-grid
      - run: npm run test:cron

      - run: npm run test:contact
      - run: npm run test:estate-conversion
      - run: npm run test:neon-auth
      - run: npm run test:command-center
      - run: npm run test:staff-notifications
      - run: npm run test:whatsapp-enquiries
      - run: npm run test:no-link
      - run: npm run test:woztell
      - run: npm run test:operations

      - run: npm run test:control-plane
      - run: npm run test:job-wake
      - run: npm run test:ratelimit
      - run: npm run test:team
      - run: npm run test:property-experience
      - run: npm run test:content-copilot
      - run: npm run test:crm-analysis
      - run: npm run test:live-agent
      - run: npm run test:admin-properties
      - run: npm run test:cms
      - run: npm run test:youtube-sync
      - run: npm run test:migration
      - run: npm run test:mls:cloudflare

      # Suites added after the original matrix. src/test-wiring.test.mjs now
      # fails when a deterministic test:* script is absent from this workflow.
      # test:a11y needs a browser server; :db suites need a disposable database.
      - run: npm run test:transactions
      - run: npm run test:estate-reviews
      - run: npm run test:valuation
      - run: npm run test:admin-estates
      - run: npm run test:legal
      - run: npm run test:analytics
  no-link-local-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Full-schema golden uses only a new loopback container, synthetic data and
      # fake provider ports. No DATABASE_URL or provider secret is supplied.
      - run: docker pull pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
      - run: npm run test:no-link:local-postgres
      - run: npm run test:admin-golden:db
      - run: npm run test:ai-knowledge:db
      - run: npm run test:crm-analysis:db
      - run: npm run test:conversation-assist:db
      - run: npm run test:whatsapp-setup:db
      - run: npm run test:propertyhk-reconciliation:owned:db
      - run: npm run test:property-withdrawal:owned:db
      - run: npm run test:property-maintenance:owned:db
      - run: npm run test:admin-overview:db
      - run: npm run test:admin-campaign:db
      - run: npm run test:admin-performance:db
      - run: npm run test:admin-link-bulk:db
      - run: npm run test:operations:owned:db
      - run: npm run test:whatsapp-access:db
  browser-handoff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Real wizard UI with synthetic API; no database or provider credentials.
      - run: npm run acceptance:whatsapp-link-handoff
  browser-no-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Actual inbox route/shell/CSS with test-only Auth/API adapters. The runner
      # owns a loopback server and blocks every external or mutation request.
      - run: npm run acceptance:whatsapp-no-link:synthetic
  browser-staging:
    if: ${{ vars.STAGING_BASE_URL != '' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # @playwright/test is lockfile-pinned; install only its Chromium revision.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
