# P0 of the frontend revamp (docs/superpowers/plans/2026-08-28-frontend-revamp.md): the
# first CI gate this repo has had beyond migration-drift.yml. Runs on every PR and push
# to main so a regression is caught before merge instead of found in production.
#
# Two steps below are ratchets, not zero-defect gates, and seven test steps are marked
# continue-on-error: all of that is pre-existing breakage recorded at P0 baseline
# (docs/superpowers/reports/2026-08-28-revamp-baseline.md), not something this phase
# fixes as a side effect. Each is commented with why. Raise a ratchet baseline, or drop
# a continue-on-error, only when a PR's own description explains and justifies it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Pinned, not "latest" -- an unpinned bun broke this CI run when a new
      # release changed bun:test's mock.module semantics enough to make
      # workers/mls-container/src/container.test.ts's Container mock stop
      # taking effect (this.ctx came back undefined in 7 tests that passed
      # locally against 1.3.12). Bump deliberately, verified locally, not
      # automatically.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: npm ci

      # Ratchet, not a zero-error gate. At P0, `npm run lint` reported 6185 problems
      # across 350 files, 6182 of them "prettier/prettier" formatting drift. Root
      # cause found later (see fix/prettier-config-resolution, not yet merged into
      # this branch's history): package.json's top-level "prettier" key shadows
      # .prettierrc entirely rather than merging with it, so Prettier silently
      # resolves to its default printWidth: 80 instead of this repo's documented
      # 100-col convention -- both for the bare CLI and eslint-plugin-prettier's
      # internal resolution. (The prior comment here attributed this to a pinned-
      # vs-resolved prettier version mismatch; that was a wrong hypothesis from
      # before the real cause was found -- correcting it now rather than repeating
      # it.) Reformatting every drifted file is a mechanical, out-of-scope diff for
      # a phase whose own rule is "ships no behaviour change" -- this fails only if
      # a PR adds MORE problems than the recorded baseline, real rule violations
      # included.
      #
      # Raised to 6186 at the end of P1 (design-system foundation): the new
      # src/components/layout/Section.tsx carries one unavoidable
      # react-refresh/only-export-components warning (it exports sectionVariants
      # alongside the component, same as ui/badge.tsx's badgeVariants -- but
      # ui/**/* has an eslint.config.js override silencing exactly this pattern,
      # and extending that override to layout/**/* is blocked by this repo's
      # config-protection Claude Code hook, which refuses any edit to an existing
      # eslint.config.js regardless of intent). Once a human lifts that hook and
      # the override is extended, drop this back to 6185.
      #
      # Raised to 6209 at the end of P2 (data trust): the 4 real rule violations
      # (3 no-explicit-any, 1 react-refresh/only-export-components) are unchanged
      # from the P1 baseline -- the +23 is entirely new prettier/prettier noise
      # from P2's own new/edited lines being correctly formatted at 100 cols (per
      # CLAUDE.md) but linted under this branch's still-broken 80-col-resolving
      # config, since fix/prettier-config-resolution hasn't merged into this stack
      # yet. This baseline should drop sharply -- likely back toward P1's own
      # 6186, or lower -- once that fix lands and this branch rebases onto it;
      # don't treat 6209 as a new steady-state to defend.
      #
      # Raised to 6231 during P3 Task 5 (listing_alerts migration + notify-me
      # form): confirmed via `npx eslint . --format json` before/after this
      # task's own diff that the same 4 real rule violations are still the
      # only non-prettier problems -- the +22 (6210 measured on P3 tasks 1-4
      # alone, already 1 over the recorded 6209, plus +21 from this task) is
      # again entirely prettier/prettier noise from this task's own new files
      # (listing-alerts.js/.test.mjs) and new lines in already-100-col-correct
      # files (admin-data.ts, listings.tsx, listings.contract.test.mjs), same
      # root cause as P2's entry above. Still not a new steady-state to defend.
      #
      # Raised to 6263 at the end of P3 (search and property detail): the same
      # 4 real rule violations are still the only non-prettier problems
      # (confirmed via `npx eslint . --format json`, verified stat-isolated
      # per-task by every task's own review this phase, e.g. by checking out
      # each pre-commit file version and re-linting). The +32 is prettier/
      # prettier noise from Tasks 6-8's new/edited lines (property.$listingNo.tsx's
      # gallery/status rework, listings.tsx's mortgage/transport/homepage
      # additions) under this branch's still-unmerged prettier-config fix
      # (fix/prettier-config-resolution, PR #76). Same as every prior entry:
      # not a new steady-state to defend -- this whole ratchet collapses back
      # toward its real, much lower value once that fix merges and this stack
      # rebases onto it.
      - name: Lint (ratchet against recorded baseline)
        env:
          ESLINT_BASELINE: 6263
        run: |
          set +e
          npx eslint . --format json > eslint-report.json
          set -e
          PROBLEM_COUNT=$(jq '[.[] | (.errorCount + .warningCount)] | add // 0' eslint-report.json)
          echo "eslint reported $PROBLEM_COUNT problem(s); baseline is $ESLINT_BASELINE"
          if [ "$PROBLEM_COUNT" -gt "$ESLINT_BASELINE" ]; then
            npx eslint . || true
            echo "::error::eslint problem count ($PROBLEM_COUNT) exceeds the recorded baseline ($ESLINT_BASELINE) -- this PR introduced new lint problems"
            exit 1
          fi

      # Ratchet, not a zero-error gate. The P0 baseline measured 0 tsc errors (the
      # CHANGELOG's older "56 errors" note is stale) -- this fails on any new error.
      - name: Typecheck (ratchet against recorded baseline)
        env:
          TSC_BASELINE: 0
        run: |
          set +e
          npx tsc --noEmit > tsc-output.txt 2>&1
          set -e
          cat tsc-output.txt
          ERROR_COUNT=$(grep -c "error TS" tsc-output.txt || true)
          echo "tsc reported $ERROR_COUNT error(s); baseline is $TSC_BASELINE"
          if [ "$ERROR_COUNT" -gt "$TSC_BASELINE" ]; then
            echo "::error::tsc error count ($ERROR_COUNT) exceeds the recorded baseline ($TSC_BASELINE) -- this PR introduced new type errors"
            exit 1
          fi

      - run: npm run build

      # Full non-":db" test:* matrix from package.json. The three ":db"-suffixed
      # scripts (test:mls:db, test:control-plane:db, test:youtube-sync:db) need a
      # live database and are intentionally excluded here -- see the P0 baseline
      # report for what each script covers and its current pass/fail state.
      - run: npm run test:corridor
      - run: npm run test:seo

      # Added during P1 (design-system foundation): src/lib/format.ts,
      # src/components/layout/*, src/components/media/AppImage.tsx, and
      # src/styles.css didn't exist at P0 baseline.
      - run: npm run test:format
      - run: npm run test:layout
      - run: npm run test:media
      - run: npm run test:styles

      # Added during P2 (data trust): src/routes/district.sham-tseng.test.mjs
      # didn't exist at P1 baseline -- it guards DR-5 (no unsourced school
      # list on the 深井 district page).
      - run: npm run test:district

      # Pre-existing failure: expects src/routes/api.youtube-sync.tsx; the actual
      # route file has a different extension/name. See baseline report.
      - run: npm run test:blog
        continue-on-error: true

      - run: npm run test:videos
      - run: npm run test:homepage
      - run: npm run test:mls
      - run: npm run test:listing-search
      - run: npm run test:cron

      # Pre-existing failure: src/config/site.test.mjs "videos page orders CMS videos
      # above listing videos" assertion. See baseline report.
      - run: npm run test:contact
        continue-on-error: true

      # Pre-existing failure: estate-conversion.test.mjs "featured listings section
      # should carry its eyebrow" assertion. See baseline report.
      - run: npm run test:estate-conversion
        continue-on-error: true

      - run: npm run test:neon-auth
      - run: npm run test:command-center
      - run: npm run test:woztell
      - run: npm run test:operations

      # Pre-existing failure: MIGRATION_VERSIONS manifest is missing
      # 20260822120000_whatsapp_audience_segment_link.sql. Real drift -- fix by
      # updating the manifest, not by loosening this check. See baseline report.
      - run: npm run test:control-plane
        continue-on-error: true

      # Pre-existing failure: admin-team.contract.test.mjs fixture dates
      # (invitationExpiresAt 2026-08-17) are now in the past, so the computed
      # invitation state legitimately differs from the hardcoded expectation.
      # See baseline report.
      - run: npm run test:team
        continue-on-error: true

      # Pre-existing failure: shares src/config/site.test.mjs with test:contact
      # above (same video-ordering assertion). See baseline report.
      - run: npm run test:property-experience
        continue-on-error: true

      # Pre-existing failure: ai-contract.test.mjs's secret-scan regex flags an
      # error-message string in neon-lock.mjs that names an env var ("...is
      # required") rather than leaking its value -- a false positive. See baseline
      # report.
      - run: npm run test:content-copilot
        continue-on-error: true

      - run: npm run test:cms
      - run: npm run test:youtube-sync
      - run: npm run test:migration
      - run: npm run test:mls:cloudflare
