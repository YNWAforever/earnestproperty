# Check migration drift when migration files change or an operator asks for it.
# A daily database check would wake Neon even when no migration changed.
#
# Runs on pull_request as well as push, so drift is visible while the change is
# still reviewable. The push trigger alone is too late: on 2026-11-06 this
# workflow went red on the merge commit `1d38be96` while Vercel had already
# deployed the same commit, taking /blog, 62 estate pages and /sitemap.xml down.
# The build-time counterpart of this check lives in
# scripts/neon/build-migration-gate.mjs and runs as part of `prebuild`.
#
# To make this a real gate rather than a notification, add "Migration drift" to
# the branch protection rules for `main` as a required status check.
name: Migration drift

on:
  push:
    branches: [main]
    paths:
      - "neon/migrations/**"
      - "src/lib/control-plane/migration-versions.js"
      - "scripts/neon/build-migration-gate.mjs"
      - ".github/workflows/migration-drift.yml"
  pull_request:
    paths:
      - "neon/migrations/**"
      - "src/lib/control-plane/migration-versions.js"
      - "scripts/neon/build-migration-gate.mjs"
      - ".github/workflows/migration-drift.yml"
  workflow_dispatch:

# Two pushes to main in quick succession would otherwise race to report on the
# same database. Only the newest answer is worth having. Pull requests get their
# own group so a PR check cannot cancel the post-merge backstop.
concurrency:
  group: migration-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Guards the manifest the drift check reads: if MIGRATION_VERSIONS has
      # fallen behind neon/migrations, the check below would report "0 pending"
      # while the database was missing a column.
      - run: node --test src/lib/control-plane/migration-versions.test.mjs
      - run: npm run check:migration-drift
        env:
          # Read-only usage: the script runs SELECTs and applies nothing. Prefer a
          # role without DDL rights here -- CI never needs to write schema.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
