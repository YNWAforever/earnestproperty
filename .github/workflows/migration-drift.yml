# Checks that every migration in the repo is recorded in the target database.
#
# Why this is a required-status-check candidate, not just a notification:
# on 2026-11-06 the blog CMS code merged and deployed while the three migrations
# it depends on were never applied. This workflow DID go red -- on the merge
# commit `1d38be96`, 84 seconds before Vercel created the production deployment.
# It changed nothing, because the check ran after merge and was not required.
# /blog, all 112 article URLs, 62 estate pages and /sitemap.xml were down for
# two days. See docs/incidents/2026-11-06-code-before-schema.md.
#
# Two layers now cover this:
#   1. build-time -- scripts/neon/build-migration-gate.mjs runs in `prebuild` and
#      FAILS a production Vercel build when the database is behind the code, so
#      the previous working deployment keeps serving.
#   2. review-time -- this workflow, required on `main`, so the same signal is
#      red before anything merges.
#
# The pull_request trigger deliberately has NO path filter. A required check that
# only runs for some pull requests would sit "expected" forever on every other
# one and block the merge queue instead of protecting it. The whole check is two
# read-only SELECTs, so running it on every PR is cheap.
name: Migration drift

on:
  pull_request:
  push:
    branches: [main]
    # Post-merge backstop: only when something that can change the answer moved.
    # This one keeps the path filter -- it is not a required check, and there is
    # no reason to wake Neon for a docs-only merge.
    paths:
      - "neon/migrations/**"
      - "src/lib/control-plane/migration-versions.js"
      - "scripts/neon/build-migration-gate.mjs"
      - ".github/workflows/migration-drift.yml"
  workflow_dispatch:

# Two runs on the same ref would otherwise race to report on the same database.
# Pull requests get their own group so a PR check cannot cancel the post-merge
# backstop.
concurrency:
  group: migration-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the check name branch protection requires. Keep it stable.
  migration-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Guards the manifest the drift check reads: if MIGRATION_VERSIONS has
      # fallen behind neon/migrations, the check below would report "0 pending"
      # while the database was missing a column.
      - run: node --test src/lib/control-plane/migration-versions.test.mjs
      - run: npm run check:migration-drift
        env:
          # Read-only usage: the script runs SELECTs and applies nothing. Prefer a
          # role without DDL rights here -- CI never needs to write schema.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
